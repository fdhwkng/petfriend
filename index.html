<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Friend — Ev heyvanınız üçün</title>
<meta name="description" content="Ev heyvanınız üçün seçilmiş məhsullar. Bəyəndiyinizi birbaşa WhatsApp-dan soruşun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1F3B2C;
    --pine-light:#2E5540;
    --bg:#EDF1E8;
    --card:#FFFFFF;
    --honey:#D98E2B;
    --ink:#22301F;
    --muted:#66765F;
    --line:#DCE3D5;
    --wa:#25D366;
    --wa-dark:#1DA851;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:20px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  .site-header{background:var(--pine);color:#fff;padding:28px 0 26px;}
  .header-inner{display:flex;flex-direction:column;gap:4px;}
  .wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.9rem;
    color:#fff;
    text-decoration:none;
    letter-spacing:-0.01em;
  }
  .tagline{margin:0;color:#C9D8C2;font-size:0.95rem;}

  .intro{padding:34px 0 18px;}
  .intro h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(1.4rem,3vw,1.9rem);
    line-height:1.3;
    max-width:640px;
    margin:0;
    color:var(--pine);
  }

  .filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:14px 20px 20px;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .filter-pill{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#fff;
    color:var(--pine);
    padding:8px 16px;
    border-radius:100px;
    font-size:0.9rem;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
  }
  .filter-pill:hover{border-color:var(--pine-light);}
  .filter-pill.active{background:var(--pine);border-color:var(--pine);color:#fff;}

  main{padding-bottom:60px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:22px;
  }

  .card{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .card-photo{
    aspect-ratio:1/1;
    background:#E4E9DE;
    overflow:hidden;
  }
  .card-photo img{width:100%;height:100%;object-fit:cover;}
  .card-photo.no-photo{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.85rem;}
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .tag{
    align-self:flex-start;
    font-size:0.75rem;
    color:var(--honey);
    background:#FBF0DD;
    padding:3px 10px;
    border-radius:100px;
    font-weight:600;
  }
  .card-body h3{
    margin:0;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--pine);
  }
  .desc{
    margin:0;
    color:var(--muted);
    font-size:0.92rem;
    line-height:1.5;
    flex:1;
  }
  .price{
    margin:0;
    font-weight:700;
    color:var(--ink);
    font-size:1.02rem;
  }
  .wa-btn{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--wa);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:0.92rem;
    padding:11px 14px;
    border-radius:10px;
    transition:background .15s;
  }
  .wa-btn:hover{background:var(--wa-dark);}
  .wa-btn:focus-visible, .filter-pill:focus-visible{outline:2px solid var(--pine-light);outline-offset:2px;}
  .wa-btn svg{flex:0 0 auto;}

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:1rem;
  }
  .skeleton{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
  }

  .site-footer{
    border-top:1px solid var(--line);
    padding:22px 0;
    color:var(--muted);
    font-size:0.85rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>

<body>

<header class="site-header">
  <div class="wrap header-inner">
    <span class="wordmark">Pet Friend</span>
    <p class="tagline">Ev heyvanınız üçün seçilmiş məhsullar</p>
  </div>
</header>

<section class="intro wrap">
  <h1>Məhsullarımıza baxın, bəyəndiyinizi birbaşa WhatsApp-dan soruşun.</h1>
</section>

<div class="filters wrap" id="filters"></div>

<main class="wrap">
  <p class="skeleton" id="loading">Məhsullar yüklənir...</p>
  <div class="grid" id="grid" hidden></div>
  <p class="empty" id="emptyState" hidden>Hələ məhsul əlavə edilməyib. Tezliklə burada olacaq!</p>
</main>

<footer class="site-footer">
  <div class="wrap">© 2026 Pet Friend</div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXzYlOYv5gBgeSoKPhrLVmOutTZPlOxns",
    authDomain: "petfriend-az.firebaseapp.com",
    projectId: "petfriend-az",
    storageBucket: "petfriend-az.firebasestorage.app",
    messagingSenderId: "970042291926",
    appId: "1:970042291926:web:7b3b4124cab520e3863b77",
    measurementId: "G-84BZXVMWCJ"
  };

  // WhatsApp nömrəsini dəyişmək üçün aşağıdakı sətri redaktə edin (ölkə kodu ilə, + işarəsi olmadan):
  const WHATSAPP_NUMBER = "994503068700";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const gridEl = document.getElementById('grid');
  const loadingEl = document.getElementById('loading');
  const emptyEl = document.getElementById('emptyState');
  const filtersEl = document.getElementById('filters');

  let allProducts = [];
  let activeCategory = 'Hamısı';

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function waLink(name){
    const msg = `Salam, "${name}" haqqında məlumat almaq istəyirəm.`;
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  }

  const waIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.1-1.34A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Z" stroke="#fff" stroke-width="1.4"/><path d="M8.5 8.7c.2-.55.7-.55 1.1-.55.3 0 .5 0 .7.5.2.5.7 1.7.75 1.85.05.15.1.3 0 .5-.1.2-.15.3-.3.45-.15.15-.3.3-.15.6.15.3.7 1.15 1.5 1.85.9.8 1.6 1.05 1.9 1.2.3.15.5.1.65-.1.15-.2.65-.75.85-1 .2-.25.4-.2.65-.1.25.1 1.6.75 1.9.9.3.15.5.2.55.35.05.15.05.85-.2 1.65-.25.8-1.5 1.45-2.05 1.5-.55.05-1.05.25-3.55-.75-2.5-1-4.05-3.55-4.15-3.75-.1-.2-.85-1.15-.85-2.2 0-1.05.55-1.55.75-1.75Z" fill="#fff"/></svg>`;

  function renderFilters(categories){
    const cats = ['Hamısı', ...categories];
    filtersEl.innerHTML = cats.map(c =>
      `<button type="button" class="filter-pill${c===activeCategory?' active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
    filtersEl.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        renderFilters(categories);
        renderGrid();
      });
    });
  }

  function renderGrid(){
    const items = activeCategory === 'Hamısı'
      ? allProducts
      : allProducts.filter(p => p.category === activeCategory);

    if(items.length === 0){
      gridEl.hidden = true;
      emptyEl.hidden = false;
      emptyEl.textContent = allProducts.length === 0
        ? 'Hələ məhsul əlavə edilməyib. Tezliklə burada olacaq!'
        : 'Bu kateqoriyada hələ məhsul yoxdur.';
      return;
    }
    gridEl.hidden = false;
    emptyEl.hidden = true;

    gridEl.innerHTML = items.map(p => `
      <article class="card">
        <div class="card-photo${p.photo ? '' : ' no-photo'}">
          ${p.photo ? `<img src="${p.photo}" alt="${escapeHtml(p.name)}" loading="lazy">` : 'Şəkil yoxdur'}
        </div>
        <div class="card-body">
          ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
          <h3>${escapeHtml(p.name)}</h3>
          ${p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : ''}
          ${p.price ? `<p class="price">${escapeHtml(p.price)} ₼</p>` : ''}
          <a class="wa-btn" href="${waLink(p.name)}" target="_blank" rel="noopener">${waIcon} WhatsApp-dan soruş</a>
        </div>
      </article>
    `).join('');
  }

  async function loadProducts(){
    try{
      const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(e){
      console.error('Məhsullar yüklənərkən xəta:', e);
      allProducts = [];
    }
    loadingEl.hidden = true;
    const categories = [...new Set(allProducts.map(p => p.category).filter(Boolean))];
    renderFilters(categories);
    renderGrid();
  }

  loadProducts();
</script>

</body>
</html>
