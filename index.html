<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Friend — Ev heyvanınız üçün</title>
<meta name="description" content="Ev heyvanınız üçün seçilmiş məhsullar. Bəyəndiyinizi birbaşa WhatsApp-dan soruşun.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine:#1F3B2C;
    --pine-light:#2E5540;
    --bg:#EDF1E8;
    --card:#FFFFFF;
    --honey:#D98E2B;
    --ink:#22301F;
    --muted:#66765F;
    --line:#DCE3D5;
    --wa:#25D366;
    --wa-dark:#1DA851;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:20px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

  .site-header{background:var(--pine);color:#fff;padding:18px 0;position:relative;z-index:30;}
  .header-inner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.7rem;
    color:#fff;
    text-decoration:none;
    letter-spacing:-0.01em;
    flex:0 0 auto;
  }

  .cat-nav{position:relative;flex:0 0 auto;}
  .cat-nav-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--honey);color:#2A1D08;border:none;
    font-family:inherit;font-weight:600;font-size:0.92rem;
    padding:10px 16px;border-radius:9px;cursor:pointer;
  }
  .cat-nav-btn .chev{transition:transform .15s;font-size:0.75rem;}
  .cat-nav-btn.open .chev{transform:rotate(180deg);}
  .cat-mega{
    display:none;position:absolute;top:calc(100% + 8px);left:0;
    background:#fff;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.18);
    min-width:260px;max-width:320px;padding:8px;z-index:40;
  }
  .cat-mega.open{display:block;}
  .cat-mega-item{border-bottom:1px solid var(--line);}
  .cat-mega-item:last-child{border-bottom:none;}
  .cat-mega-head{display:flex;align-items:stretch;}
  .cat-name-btn{
    flex:1;background:none;border:none;font-family:inherit;
    padding:11px 4px 11px 10px;font-size:0.95rem;color:var(--ink);cursor:pointer;text-align:left;
  }
  .cat-name-btn:hover{color:var(--pine-light);}
  .cat-chev-btn{
    background:none;border:none;padding:11px 10px;cursor:pointer;color:var(--muted);
  }
  .cat-chev-btn .chev{display:inline-block;transition:transform .15s;font-size:0.75rem;}
  .cat-chev-btn.open .chev{transform:rotate(90deg);}
  .cat-subs{max-height:0;overflow:hidden;transition:max-height .18s ease;}
  .cat-subs.open{max-height:300px;}
  .cat-sub-btn{
    display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;
    padding:8px 10px 8px 24px;font-size:0.86rem;color:var(--muted);cursor:pointer;
  }
  .cat-sub-btn:hover{color:var(--pine-light);}

  .search-box{flex:1 1 180px;min-width:160px;}
  .search-box input{
    width:100%;padding:10px 14px;border-radius:9px;border:none;
    font-family:inherit;font-size:0.9rem;background:rgba(255,255,255,.14);color:#fff;
  }
  .search-box input::placeholder{color:#C9D8C2;}
  .search-box input:focus{outline:2px solid var(--honey);background:#fff;color:var(--ink);}

  .active-filter{
    display:inline-flex;align-items:center;gap:8px;
    background:#fff;border:1px solid var(--line);color:var(--pine);
    padding:6px 8px 6px 14px;border-radius:100px;font-size:0.86rem;margin:0 0 16px;
  }
  .active-filter button{
    background:var(--pine);color:#fff;border:none;border-radius:50%;
    width:20px;height:20px;line-height:1;cursor:pointer;font-size:0.8rem;
  }

  .intro{padding:34px 0 18px;}
  .intro h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(1.4rem,3vw,1.9rem);
    line-height:1.3;
    max-width:640px;
    margin:0;
    color:var(--pine);
  }

  .brands-section{padding:4px 0 6px;}
  .section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.25rem;
    color:var(--pine);
    margin:0 0 16px;
  }
  section + section{margin-top:12px;}
  .brand-row{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:none;
    scroll-behavior:smooth;
  }
  .brand-row::-webkit-scrollbar{display:none;}
  .brand-item{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    background:none;
    border:none;
    font-family:inherit;
    padding:0;
  }
  .brand-logo{
    width:76px;
    height:76px;
    border-radius:50%;
    background:#fff;
    border:1.5px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:border-color .15s, transform .15s;
  }
  .brand-logo img{width:70%;height:70%;object-fit:contain;}
  .brand-logo.no-logo{font-family:'Fraunces',serif;font-weight:600;color:var(--pine);font-size:1.3rem;}
  .brand-item:hover .brand-logo{border-color:var(--pine-light);}
  .brand-item.active .brand-logo{border-color:var(--honey);border-width:2px;transform:translateY(-2px);}
  .brand-name{font-size:0.78rem;color:var(--muted);max-width:84px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-item.active .brand-name{color:var(--pine);font-weight:600;}

  .brand-tag{
    align-self:flex-start;
    font-size:0.75rem;
    color:var(--muted);
    background:#fff;
    border:1px solid var(--line);
    padding:3px 10px;
    border-radius:100px;
  }
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;}

  main{padding-bottom:40px;}
  main.wrap > section{margin-bottom:38px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:22px;
  }

  .card{
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .card-link{display:flex;flex-direction:column;flex:1;color:inherit;text-decoration:none;}
  .card-photo{
    aspect-ratio:1/1;
    background:#E4E9DE;
    overflow:hidden;
  }
  .card-photo img{width:100%;height:100%;object-fit:cover;}
  .card-photo.no-photo{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.85rem;}
  .card-body{padding:16px 16px 0;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-cta{padding:10px 16px 16px;}
  .tag{
    align-self:flex-start;
    font-size:0.75rem;
    color:var(--honey);
    background:#FBF0DD;
    padding:3px 10px;
    border-radius:100px;
    font-weight:600;
  }
  .card-body h3{
    margin:0;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--pine);
  }
  .desc{
    margin:0;
    color:var(--muted);
    font-size:0.92rem;
    line-height:1.5;
    flex:1;
  }
  .price{
    margin:0;
    font-weight:700;
    color:var(--ink);
    font-size:1.02rem;
  }
  .wa-btn{
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--wa);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:0.92rem;
    padding:11px 14px;
    border-radius:10px;
    transition:background .15s;
  }
  .wa-btn:hover{background:var(--wa-dark);}
  .wa-btn:focus-visible{outline:2px solid var(--pine-light);outline-offset:2px;}
  .wa-btn svg{flex:0 0 auto;}

  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:1rem;
  }
  .skeleton{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
  }

  .site-footer{
    background:var(--pine);
    color:#C9D8C2;
    padding:38px 0 24px;
    margin-top:50px;
  }
  .footer-top{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;margin-bottom:26px;}
  .footer-contact{display:flex;flex-direction:column;gap:8px;font-size:0.92rem;}
  .footer-contact a{color:#C9D8C2;text-decoration:none;}
  .footer-contact a:hover{color:#fff;}
  .footer-social{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .social-icon{
    width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;color:#fff;
    text-decoration:none;font-size:0.72rem;font-weight:700;letter-spacing:-0.02em;
    transition:background .15s;
  }
  .social-icon:hover{background:var(--honey);}
  .social-icon svg{width:18px;height:18px;}
  .footer-bottom{border-top:1px solid rgba(255,255,255,.15);padding-top:16px;font-size:0.8rem;color:#9FB294;}

  @media (max-width:560px){
    .header-inner{gap:10px;}
    .search-box{order:3;flex-basis:100%;}
    .cat-mega{left:0;right:0;max-width:none;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
    .brand-row{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="/">Pet Friend</a>
    <div class="cat-nav" id="catNav" hidden>
      <button type="button" class="cat-nav-btn" id="catNavBtn">☰ Kateqoriyalar <span class="chev">▾</span></button>
      <div class="cat-mega" id="catMega"></div>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="Məhsul axtar...">
    </div>
  </div>
</header>

<section class="intro wrap">
  <h1>Məhsullarımıza baxın, bəyəndiyinizi birbaşa WhatsApp-dan soruşun.</h1>
</section>

<main class="wrap">
  <div id="activeFilterWrap"></div>

  <section id="featuredSection" hidden>
    <h2 class="section-title">⭐ Ən yaxşı məhsullar</h2>
    <div class="grid" id="featuredGrid"></div>
  </section>

  <section class="brands-section" id="brandsSection" hidden>
    <h2 class="section-title">Brendlərimiz</h2>
    <div class="brand-row" id="brandRow"></div>
  </section>

  <section id="latestSection">
    <h2 class="section-title">Son əlavə olunan məhsullar</h2>
    <p class="skeleton" id="loading">Məhsullar yüklənir...</p>
    <div class="grid" id="grid" hidden></div>
    <p class="empty" id="emptyState" hidden>Hələ məhsul əlavə edilməyib. Tezliklə burada olacaq!</p>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-top">
      <div class="footer-contact" id="footerContact"></div>
      <div class="footer-social" id="footerSocial"></div>
    </div>
    <div class="footer-bottom">© 2026 Pet Friend</div>
  </div>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, doc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  // Qeyd: aktiv/deaktiv filtri bilərəkdən burada deyil, JS tərəfində edilir —
  // beləliklə Firestore-da composite index qurmağa ehtiyac qalmır.

  const firebaseConfig = {
    apiKey: "AIzaSyDXzYlOYv5gBgeSoKPhrLVmOutTZPlOxns",
    authDomain: "petfriend-az.firebaseapp.com",
    projectId: "petfriend-az",
    storageBucket: "petfriend-az.firebasestorage.app",
    messagingSenderId: "970042291926",
    appId: "1:970042291926:web:7b3b4124cab520e3863b77",
    measurementId: "G-84BZXVMWCJ"
  };

  // Hər bir məhsulun WhatsApp düyməsi üçün nömrə (ölkə kodu ilə, + işarəsi olmadan).
  // Admin → Sayt Ayarları-da fərqli nömrə qeyd etsəniz, footer-dəki WhatsApp ikonu onu istifadə edəcək.
  const WHATSAPP_NUMBER = "994503068700";

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const gridEl = document.getElementById('grid');
  const loadingEl = document.getElementById('loading');
  const emptyEl = document.getElementById('emptyState');
  const catNav = document.getElementById('catNav');
  const catNavBtn = document.getElementById('catNavBtn');
  const catMega = document.getElementById('catMega');
  const searchInput = document.getElementById('searchInput');
  const activeFilterWrap = document.getElementById('activeFilterWrap');
  const featuredSection = document.getElementById('featuredSection');
  const featuredGrid = document.getElementById('featuredGrid');
  const brandsSectionEl = document.getElementById('brandsSection');
  const brandRowEl = document.getElementById('brandRow');
  const latestSection = document.getElementById('latestSection');
  const footerContact = document.getElementById('footerContact');
  const footerSocial = document.getElementById('footerSocial');
  const metaDescTag = document.querySelector('meta[name="description"]');
  const defaultTitle = document.title;
  const defaultMetaDesc = metaDescTag ? metaDescTag.content : '';

  let allProducts = [];
  let allBrands = [];
  let allCategories = [];
  let activeCategory = null;
  let activeSubCategory = null;
  let activeBrandId = null;
  let searchQuery = '';
  let brandScrollTimer = null;

  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function waLink(name){
    const msg = `Salam, "${name}" haqqında məlumat almaq istəyirəm.`;
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  }

  const waIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.1-1.34A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Z" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 8.7c.2-.55.7-.55 1.1-.55.3 0 .5 0 .7.5.2.5.7 1.7.75 1.85.05.15.1.3 0 .5-.1.2-.15.3-.3.45-.15.15-.3.3-.15.6.15.3.7 1.15 1.5 1.85.9.8 1.6 1.05 1.9 1.2.3.15.5.1.65-.1.15-.2.65-.75.85-1 .2-.25.4-.2.65-.1.25.1 1.6.75 1.9.9.3.15.5.2.55.35.05.15.05.85-.2 1.65-.25.8-1.5 1.45-2.05 1.5-.55.05-1.05.25-3.55-.75-2.5-1-4.05-3.55-4.15-3.75-.1-.2-.85-1.15-.85-2.2 0-1.05.55-1.55.75-1.75Z" fill="currentColor"/></svg>`;

  /* ---------- WhatsApp click tracking (İdarə Paneli üçün) ---------- */
  function trackWaClick(p){
    try{
      addDoc(collection(db, 'whatsappClicks'), {
        productId: (p && p.id) || null,
        productName: (p && p.name) || '',
        createdAt: Date.now()
      }).catch(() => {});
    }catch(e){ /* izləmə uğursuz olsa belə WhatsApp linki açılmağa davam etsin */ }
  }

  /* ---------- Product card (həm "Ən yaxşı", həm "Son əlavə olunan" bölmələri bunu istifadə edir) ---------- */
  function cardHtml(p){
    return `
      <article class="card">
        <a class="card-link" href="/mehsul?id=${encodeURIComponent(p.id)}">
          <div class="card-photo${p.photo ? '' : ' no-photo'}">
            ${p.photo ? `<img src="${p.photo}" alt="${escapeHtml(p.name)}" loading="lazy">` : 'Şəkil yoxdur'}
          </div>
          <div class="card-body">
            <div class="tag-row">
              ${p.category ? `<span class="tag">${escapeHtml(p.category)}</span>` : ''}
              ${p.brandName ? `<span class="brand-tag">${escapeHtml(p.brandName)}</span>` : ''}
            </div>
            <h3>${escapeHtml(p.name)}</h3>
            ${p.description ? `<p class="desc">${escapeHtml(p.description)}</p>` : ''}
            ${p.price ? `<p class="price">${escapeHtml(p.price)} ₼</p>` : ''}
          </div>
        </a>
        <div class="card-cta">
          <a class="wa-btn" data-id="${p.id}" href="${waLink(p.name)}" target="_blank" rel="noopener">${waIcon} WhatsApp-dan soruş</a>
        </div>
      </article>
    `;
  }

  function attachWaTracking(container){
    container.querySelectorAll('.wa-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = allProducts.find(x => x.id === btn.dataset.id);
        trackWaClick(p);
      });
    });
  }

  /* ---------- Axtarış + kateqoriya/brend filtri ---------- */
  function applyCategoryMeta(cat){
    if(cat && cat.metaTitle){ document.title = cat.metaTitle; }
    else if(cat){ document.title = `${cat.name} — Pet Friend`; }
    if(metaDescTag) metaDescTag.content = (cat && cat.metaDescription) ? cat.metaDescription : defaultMetaDesc;
  }

  function resetMeta(){
    document.title = defaultTitle;
    if(metaDescTag) metaDescTag.content = defaultMetaDesc;
  }

  function renderActiveFilter(){
    const parts = [];
    if(activeCategory) parts.push(activeSubCategory ? `${activeCategory} / ${activeSubCategory}` : activeCategory);
    if(searchQuery.trim()) parts.push(`"${searchQuery.trim()}"`);
    if(parts.length === 0){ activeFilterWrap.innerHTML = ''; return; }
    activeFilterWrap.innerHTML = `<div class="active-filter">${escapeHtml(parts.join(' · '))} <button type="button" id="clearFilterBtn">✕</button></div>`;
    document.getElementById('clearFilterBtn').addEventListener('click', () => {
      activeCategory = null;
      activeSubCategory = null;
      searchQuery = '';
      searchInput.value = '';
      history.replaceState(null, '', location.pathname);
      resetMeta();
      renderActiveFilter();
      renderGrid();
    });
  }

  function renderGrid(){
    const q = searchQuery.trim().toLowerCase();
    const items = allProducts.filter(p =>
      (!activeCategory || p.category === activeCategory) &&
      (!activeSubCategory || p.subCategory === activeSubCategory) &&
      (!activeBrandId || p.brandId === activeBrandId) &&
      (!q || (p.name || '').toLowerCase().includes(q))
    );

    if(items.length === 0){
      gridEl.hidden = true;
      emptyEl.hidden = false;
      emptyEl.textContent = allProducts.length === 0
        ? 'Hələ məhsul əlavə edilməyib. Tezliklə burada olacaq!'
        : 'Seçilmiş filtrə uyğun məhsul tapılmadı.';
      return;
    }
    gridEl.hidden = false;
    emptyEl.hidden = true;
    gridEl.innerHTML = items.map(cardHtml).join('');
    attachWaTracking(gridEl);
  }

  function renderFeatured(){
    const items = allProducts.filter(p => p.featured);
    if(items.length === 0){ featuredSection.hidden = true; return; }
    featuredSection.hidden = false;
    featuredGrid.innerHTML = items.map(cardHtml).join('');
    attachWaTracking(featuredGrid);
  }

  /* ---------- Kateqoriyalar mega-menyusu ---------- */
  function renderCatMega(){
    if(allCategories.length === 0){ catNav.hidden = true; return; }
    catNav.hidden = false;
    catMega.innerHTML = allCategories.map(c => `
      <div class="cat-mega-item">
        <div class="cat-mega-head">
          <button type="button" class="cat-name-btn" data-cat="${escapeHtml(c.name)}">${escapeHtml(c.name)}</button>
          ${(c.subcategories && c.subcategories.length) ? `<button type="button" class="cat-chev-btn" data-toggle="${escapeHtml(c.id)}"><span class="chev">›</span></button>` : ''}
        </div>
        ${(c.subcategories && c.subcategories.length) ? `
          <div class="cat-subs" id="subs-${escapeHtml(c.id)}">
            ${c.subcategories.map(s => `<button type="button" class="cat-sub-btn" data-cat="${escapeHtml(c.name)}" data-sub="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
          </div>
        ` : ''}
      </div>
    `).join('');

    function selectCategory(catName, subName){
      activeCategory = catName;
      activeSubCategory = subName || null;
      const cat = allCategories.find(c => c.name === catName);
      history.replaceState(null, '', cat && cat.slug ? `?kateqoriya=${encodeURIComponent(cat.slug)}` : location.pathname);
      applyCategoryMeta(cat);
      closeCatMega();
      renderActiveFilter();
      renderGrid();
      latestSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    catMega.querySelectorAll('.cat-name-btn').forEach(btn => {
      btn.addEventListener('click', () => selectCategory(btn.dataset.cat, null));
    });
    catMega.querySelectorAll('.cat-sub-btn').forEach(btn => {
      btn.addEventListener('click', () => selectCategory(btn.dataset.cat, btn.dataset.sub));
    });
    catMega.querySelectorAll('.cat-chev-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const subsEl = document.getElementById('subs-' + btn.dataset.toggle);
        btn.classList.toggle('open');
        if(subsEl) subsEl.classList.toggle('open');
      });
    });
  }

  function openCatMega(){ catMega.classList.add('open'); catNavBtn.classList.add('open'); }
  function closeCatMega(){ catMega.classList.remove('open'); catNavBtn.classList.remove('open'); }
  catNavBtn.addEventListener('click', () => {
    catMega.classList.contains('open') ? closeCatMega() : openCatMega();
  });
  document.addEventListener('click', (e) => {
    if(!catNav.contains(e.target)) closeCatMega();
  });

  searchInput.addEventListener('input', () => {
    searchQuery = searchInput.value;
    renderActiveFilter();
    renderGrid();
  });

  /* ---------- Brendlər zolağı (avtomatik sürüşən) ---------- */
  function renderBrands(){
    const activeBrands = allBrands.filter(b => b.active !== false);
    if(activeBrands.length === 0){
      brandsSectionEl.hidden = true;
      return;
    }
    brandsSectionEl.hidden = false;
    brandRowEl.innerHTML = activeBrands.map(b => `
      <button type="button" class="brand-item${b.id === activeBrandId ? ' active' : ''}" data-id="${b.id}" data-slug="${escapeHtml(b.slug || '')}">
        <span class="brand-logo${b.logo ? '' : ' no-logo'}">${b.logo ? `<img src="${b.logo}" alt="${escapeHtml(b.name)}" loading="lazy">` : escapeHtml((b.name || '?').charAt(0))}</span>
        <span class="brand-name">${escapeHtml(b.name)}</span>
      </button>
    `).join('');

    brandRowEl.querySelectorAll('.brand-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const slug = btn.dataset.slug;
        if(activeBrandId === id){
          activeBrandId = null;
          history.replaceState(null, '', location.pathname);
          document.title = defaultTitle;
          if(metaDescTag) metaDescTag.content = defaultMetaDesc;
        }else{
          activeBrandId = id;
          const b = allBrands.find(x => x.id === id);
          history.replaceState(null, '', slug ? `?brend=${encodeURIComponent(slug)}` : location.pathname);
          if(b){
            document.title = b.metaTitle || (b.name + ' — Pet Friend');
            if(metaDescTag) metaDescTag.content = b.metaDescription || defaultMetaDesc;
          }
        }
        renderBrands();
        renderGrid();
        latestSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function startBrandAutoScroll(){
    stopBrandAutoScroll();
    brandScrollTimer = setInterval(() => {
      if(!brandRowEl || brandRowEl.scrollWidth <= brandRowEl.clientWidth + 4) return;
      const atEnd = brandRowEl.scrollLeft + brandRowEl.clientWidth >= brandRowEl.scrollWidth - 4;
      brandRowEl.scrollTo(atEnd ? { left: 0, behavior: 'smooth' } : { left: brandRowEl.scrollLeft + 180, behavior: 'smooth' });
    }, 5000);
  }
  function stopBrandAutoScroll(){ if(brandScrollTimer) clearInterval(brandScrollTimer); }
  brandRowEl.addEventListener('mouseenter', stopBrandAutoScroll);
  brandRowEl.addEventListener('mouseleave', startBrandAutoScroll);

  /* ---------- Footer: əlaqə + sosial şəbəkələr (Admin → Sayt Ayarları-dan) ---------- */
  function renderFooter(settings){
    const s = settings || {};
    const lines = [];
    if(s.phone) lines.push(`<a href="tel:${escapeHtml(s.phone.replace(/\s+/g, ''))}">📞 ${escapeHtml(s.phone)}</a>`);
    if(s.email) lines.push(`<a href="mailto:${escapeHtml(s.email)}">✉️ ${escapeHtml(s.email)}</a>`);
    if(s.address) lines.push(`<span>📍 ${escapeHtml(s.address)}</span>`);
    footerContact.innerHTML = lines.join('');

    const soc = s.social || {};
    const socialDefs = [
      { label: 'FB', url: soc.facebook, name: 'Facebook' },
      { label: 'IG', url: soc.instagram, name: 'Instagram' },
      { label: 'X', url: soc.x, name: 'X' },
      { label: 'YT', url: soc.youtube, name: 'YouTube' },
      { label: 'WA', url: soc.whatsapp ? `https://wa.me/${String(soc.whatsapp).replace(/\D/g, '')}` : `https://wa.me/${WHATSAPP_NUMBER}`, name: 'WhatsApp' },
      { label: 'TG', url: soc.telegram, name: 'Telegram' },
      { label: 'TT', url: soc.tiktok, name: 'TikTok' },
    ];
    footerSocial.innerHTML = socialDefs.filter(x => x.url).map(x =>
      `<a class="social-icon" href="${escapeHtml(x.url)}" target="_blank" rel="noopener" aria-label="${x.name}">${escapeHtml(x.label)}</a>`
    ).join('');
  }

  /* ---------- Yükləmə ---------- */
  async function loadProducts(){
    try{
      const q = query(collection(db, 'products'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      // Qaralama (draft) məhsullar — admin hələ ad/qiymət/kateqoriya əlavə etməyib — saytda göstərilmir.
      allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => !p.draft);
    }catch(e){
      console.error('Məhsullar yüklənərkən xəta:', e);
      allProducts = [];
    }
  }

  async function loadBrands(){
    try{
      const q = query(collection(db, 'brands'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allBrands = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(e){
      console.error('Brendlər yüklənərkən xəta:', e);
      allBrands = [];
    }
  }

  async function loadCategories(){
    try{
      const q = query(collection(db, 'categories'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allCategories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(e){
      console.error('Kateqoriyalar yüklənərkən xəta:', e);
      allCategories = [];
    }
  }

  async function loadSettings(){
    try{
      const snap = await getDoc(doc(db, 'settings', 'site'));
      return snap.exists() ? snap.data() : null;
    }catch(e){
      console.error('Ayarlar yüklənərkən xəta:', e);
      return null;
    }
  }

  async function init(){
    const results = await Promise.all([loadProducts(), loadBrands(), loadCategories(), loadSettings()]);
    const settings = results[3];
    loadingEl.hidden = true;

    // Əgər keçid ?brend=slug ilə gəlibsə, həmin brendi əvvəlcədən seçili et
    const slugParam = new URLSearchParams(location.search).get('brend');
    if(slugParam){
      const b = allBrands.find(x => x.slug === slugParam && x.active !== false);
      if(b){
        activeBrandId = b.id;
        document.title = b.metaTitle || (b.name + ' — Pet Friend');
        if(metaDescTag) metaDescTag.content = b.metaDescription || defaultMetaDesc;
      }
    }

    // Əgər keçid ?kateqoriya=slug ilə gəlibsə, həmin kateqoriyanı əvvəlcədən seçili et
    const catSlugParam = new URLSearchParams(location.search).get('kateqoriya');
    if(catSlugParam){
      const c = allCategories.find(x => x.slug === catSlugParam);
      if(c){
        activeCategory = c.name;
        applyCategoryMeta(c);
      }
    }

    renderCatMega();
    renderFeatured();
    renderBrands();
    renderActiveFilter();
    renderGrid();
    renderFooter(settings);
    startBrandAutoScroll();
  }

  init();
</script>

</body>
</html>
